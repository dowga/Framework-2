name: E2E Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: '15 3 * * *'
      timezone: "Europe/Moscow"

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15.2

        env:
          POSTGRES_DB: paymentsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d paymentsdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v7

      - name: Checkout payments backend
        uses: actions/checkout@v7
        with:
          repository: dowga/payment-management
          path: backend

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Chrome
        run: google-chrome --version

      - name: Start payments backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/paymentsdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          nohup mvn --batch-mode spring-boot:run > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend... ($i/60)"
            sleep 2
          done

          echo "Backend failed to start"
          cat backend.log
          exit 1

      - name: Run tests
        run: |
          mvn --batch-mode clean test \
            -Dheadless=true \
            -DbaseUrl=http://localhost:8080 \
            -DuiUrl=http://localhost:8080 \
            -DdbUrl=jdbc:postgresql://localhost:5432/paymentsdb \
            -DdbUser=postgres \
            -DdbPassword=postgres

      - name: Generate Allure report
        run: mvn --batch-mode allure:report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            target/allure-results
            target/site/allure-maven-plugin
            target/surefire-reports
            backend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Allure report for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: e2e-tests

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5